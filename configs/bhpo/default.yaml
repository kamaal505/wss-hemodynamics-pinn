# @package bhpo
# BHPO search and retrain configuration.
# Tuned for M3 Pro (16 GPU cores, MPS backend).

# ── Search settings (04b_bhpo_search.py) ────────────────────────────────────
n_calls: 60            # more trials (MPS makes each trial ~5-10× faster)
n_initial_points: 12   # random warm-up before TPE takes over

# Per-trial training budget (short; winner is retrained at full budget in 04c)
# Reduced from 20 000 → 10 000 Adam steps; MPS makes each step much faster
# and TPE explores more configurations for the same wall-clock time.
n_adam_trial: 10000
n_lbfgs_trial: 200

# Fraction of wall faces held out for WSS NRMSE evaluation
val_frac: 0.2

# "auto" detects MPS → CUDA → CPU.  Override to "cpu" for WSL/Linux runs.
device: "auto"

# BHPO backend: "optuna" (default, TPE, resumable) or "skopt" (legacy GP)
backend: "optuna"

# Architecture flags fixed for this BHPO run.
# Change these to search over a different architecture family.
use_hard_sdf: true
use_vec_potential: false   # demoted; see configs/model/pinn_base.yaml (Fix M)
use_adaptive_weights: false

# Anti-collapse recipe applied to every trial (Fixes J–L).  Mirrors the
# training.* defaults so BHPO trials and the final retrain share the recipe.
lambda_aux: 5.0
aux_decay_frac: 0.5
lambda_mag_floor: 1.0
n_warmup: 1000        # shorter warm-up for the reduced per-trial Adam budget
interp_method: rbf
# Memory streaming: dense-prior points evaluated per epoch, and wall faces per
# WSS-eval chunk.  Both are adaptively halved on OOM rather than abandoning the
# trial.  Lower these if a trial still OOMs on a small GPU.
n_aux: 4096
wss_batch_size: 4096

# ── Retrain settings (04c_train_pinn_with_bhpo.py) ──────────────────────────
source_case_id: caseC

# Full retrain budget (same as before; MPS will finish in a fraction of the
# time that CPU would require).
n_adam_full: 50000
n_lbfgs_full: 5000
