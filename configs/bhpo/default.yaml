# @package bhpo
# BHPO search and retrain configuration.
# Tuned for M3 Pro (16 GPU cores, MPS backend).

# ── Search settings (04b_bhpo_search.py) ────────────────────────────────────
n_calls: 50
n_initial_points: 10   # random warm-up before TPE takes over

# Per-trial training budget (short; winner is retrained at full budget in 04c)
n_adam_trial: 2000
n_lbfgs_trial: 200

# Fraction of wall faces held out for WSS NRMSE evaluation
val_frac: 0.2

# "auto" detects MPS → CUDA → CPU.  Override to "cpu" for WSL/Linux runs.
device: "auto"

# BHPO backend: "optuna" (default, TPE, resumable) or "skopt" (legacy GP)
backend: "optuna"

# Architecture flags fixed for this BHPO run.
# Change these to search over a different architecture family.
use_hard_sdf: false
use_vec_potential: false
use_adaptive_weights: false

# ── Retrain settings (04c_train_pinn_with_bhpo.py) ──────────────────────────
source_case_id: caseC

# Full retrain budget (same as before; MPS will finish in a fraction of the
# time that CPU would require).
n_adam_full: 5000
n_lbfgs_full: 5000
