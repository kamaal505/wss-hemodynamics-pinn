# @package _global_
# PINN with Random Fourier Features encoder (ablation variant).
# Inherits all training defaults; only the architecture differs.
# See doc 03 §3 and Tancik et al. 2020.
# Practical defaults: D=128-256, sigma tuned in {1, 2, 5, 10}.

model:
  n_hidden: 128
  n_layers: 4
  use_rff: true
  rff_features: 128    # D: number of RFF frequency samples; output dim = 2D
  rff_sigma: 2.0       # bandwidth sigma; tune in {1, 2, 5, 10}
  activation: tanh     # tanh | swish | gelu
  # Mirror pinn_base so scripts/04 (which reads cfg.model.use_hard_sdf
  # unconditionally) does not crash when model=pinn_rff.
  use_hard_sdf: true
  use_vec_potential: false   # demoted; see pinn_base.yaml / notes (Fix M)

training:
  n_colloc: 10000
  n_wall_bc: 2000
  n_adam: 50000
  n_lbfgs: 5000
  lr_adam: 1.0e-3
  lr_lbfgs: 1.0
  # See pinn_base.yaml: lambda_data ≫ lambda_phys prevents magnitude collapse.
  lambda_data: 10.0
  lambda_phys: 1.0
  lambda_bc: 10.0
  lambda_anchor: 1.0
  relative_data: true
  lambda_inlet: 10.0
  inlet_source: mri   # mri | cfd (diagnostic) | none
  inlet_band_mm: 2.0
  # Dense interpolant supervision + curriculum (Fixes J–L); see pinn_base.yaml.
  lambda_aux: 5.0
  aux_decay_frac: 0.5
  lambda_mag_floor: 1.0
  n_warmup: 2000
  interp_method: rbf
  n_aux: 4096
  checkpoint_every: 1000
  device: "cpu"
  wall_bias_frac: 0.0  # fraction of collocation pts drawn from near-wall pool
  use_adaptive_weights: false
  sa_weight_lr: 1.0e-3
