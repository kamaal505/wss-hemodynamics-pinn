[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hemodyn-pinn"
version = "0.1.0"
description = "PINN-based Wall Shear Stress Recovery from Sparse, Noisy 4D-flow MRI"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: integration tests that load real mesh files (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
